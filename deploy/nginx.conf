# Prodrion — nginx site config.
# Put at /etc/nginx/sites-available/prodrion and symlink into sites-enabled.
# TLS certs are managed by certbot (certbot --nginx -d app.example.com -d api.example.com).

# ---- Static dashboard: https://app.example.com ----
server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    root /opt/prodrion/web;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location /dist/ { expires 7d; access_log off; }
}

# ---- API: https://api.example.com -> 127.0.0.1:8000 ----
server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    # Matches PRODRION_MAX_REQUEST_BYTES (1 MiB default).
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 120s;
    }
}

# ---- Redirect http -> https ----
server {
    listen 80;
    server_name app.example.com api.example.com;
    return 301 https://$host$request_uri;
}
